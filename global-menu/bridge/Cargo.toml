[package]
name = "noctalia-global-menu-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
zbus = { version = "4.4", default-features = false, features = ["blocking", "async-io"] }
zvariant = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tiny_http = "0.12"

[profile.release]
opt-level = 2
strip = true
