id           = "bighu630/shell-command"
name         = "Shell Command"
version      = "0.2.0"
plugin_api   = 14
author       = "Bighu630"
license      = "MIT"
icon         = "terminal"
description  = "Run a shell command from the launcher in the background. Type /cmd then command."
tags         = ["launcher", "productivity", "development"]
dependencies = ["bash", "fish", "sh"]

[[setting]]
key             = "default_workspace"
type            = "folder"
default         = ""
label_key       = "settings.default_workspace.label"
description_key = "settings.default_workspace.description"

[[setting]]
key             = "snippets"
type            = "string_list"
default         = []
label_key       = "settings.snippets.label"
description_key = "settings.snippets.description"

[[launcher_provider]]
id                       = "provider"
entry                    = "shell_provider.luau"
prefix                   = "cmd"
glyph                    = "terminal"
include_in_global_search = false
debounce_ms              = 150
